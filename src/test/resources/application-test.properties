# Perfil de pruebas: valores ficticios solo para tests (no son secretos reales).
# La conexión a MySQL la aporta Testcontainers (@ServiceConnection).
app.security.jwt.access-secret=test-access-secret-0123456789-abcdefghij
app.security.jwt.refresh-secret=test-refresh-secret-0123456789-abcdefghij
app.security.jwt.access-minutes=15
app.security.jwt.refresh-days=7
app.security.cors.allowed-origin=http://localhost:5174
# Marcadores de posición de application.yml; Testcontainers aporta la conexión real.
DB_USER=unused
DB_PASSWORD=unused
# El job de vencimiento de reprogramaciones (D-033) no corre durante las pruebas; se invoca a mano.
citas.reschedule.expiration-delay=PT24H
